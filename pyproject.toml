[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satnet"
version = "1.0.0"
description = "Satellite Close Approach Risk Evaluation System"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0", "pydantic-settings>=2.3,<3.0",
  "python-multipart>=0.0.9,<1.0", "httpx>=0.27,<1.0",
  "sgp4>=2.23,<3.0", "numpy>=1.26,<3.0", "scipy>=1.12,<2.0",
  "pandas>=2.2,<3.0", "scikit-learn>=1.3,<2.0", "xgboost>=2.0,<3.0",
  "sqlalchemy>=2.0,<3.0", "pymysql>=1.1,<2.0",
  "reportlab>=4.0,<5.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = [
  "live: marks tests that fetch real data from the network (CelesTrak)",
]
[tool.setuptools.packages.find]
where = ["backend"]